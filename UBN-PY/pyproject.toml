[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubn-sdk"
version = "0.3.0"
description = "UBN Async Python SDK with rich CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "click>=8.1.7",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
ubn = "ubn.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ubn*"]